{% extends "base.html" %}

{% block title %}
Consultar Pedido | SIGPET
{% endblock %}

{% block content %}

<div class="card hero-card">

    <i class="fa-solid fa-magnifying-glass fa-4x"
       style="color: var(--color-primario); margin-bottom:25px;">
    </i>

    <h1>Consultar Pedido</h1>

    <p style="margin-bottom:35px;">
        Ingresa el número de tu pedido para consultar su estado en tiempo real.
    </p>

    <form action="/buscar_pedido" method="post">

        <div class="form-group">

            <label for="numero_pedido">

                <i class="fa-solid fa-hashtag"></i>

                Número de Pedido

            </label>

            <input
                type="number"
                id="numero_pedido"
                name="numero_pedido"
                placeholder="Ejemplo: 1001"
                required>

        </div>

        <button type="submit" class="btn btn-grande">

            <i class="fa-solid fa-magnifying-glass"></i>

            Buscar Pedido

        </button>

    </form>

</div>

{% endblock %}
